name: remotetester_host
description: "RemoteAppTester host — CLI, który buduje aplikacje i dostarcza je na telefon testowy."
publish_to: 'none'

version: 0.6.0

environment:
  sdk: ^3.13.2

executables:
  remoteapptester: remoteapptester
  rt: rt

dependencies:
  # Serwer gRPC (docs/architektura-remote-build.md, sekcja 3/4)
  grpc: ^5.1.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0

  # HMAC-SHA256 / sumy kontrolne (docs/SECURITY.md)
  crypto: ^3.0.6

  # Konfiguracja YAML (config/host-config.yaml)
  yaml: ^3.1.3

  # Manipulacja/normalizacja ścieżek (ochrona przed path traversal)
  path: ^1.9.1

  # Kod QR parowania rysowany w terminalu
  qr: ^3.0.2

  # Samopodpisany certyfikat TLS generowany przy pierwszym uruchomieniu
  basic_utils: ^5.8.2

  # Windows DPAPI dla sekretów (security/dpapi.dart)
  win32: ^6.4.0
  ffi: ^2.2.0
  sqlite3: 3.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers — baza RemoteAppTestera jest szyfrowana kluczem z SecretStore
      # (Windows DPAPI / plik 0600), docs/SECURITY.md.
      source: sqlite3mc
