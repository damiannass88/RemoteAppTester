<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="How RemoteAppTester works: four steps in a loop"><title>How RemoteAppTester works: four steps in a loop</title><style>@keyframes a1{0.00%{opacity:0} 0.00%{opacity:0} 3.00%{opacity:1} 24.00%{opacity:1} 27.00%{opacity:0} 100.00%{opacity:0}}.a1{animation:a1 10s linear infinite}@keyframes a2{0.00%{opacity:0} 25.00%{opacity:0} 28.00%{opacity:1} 49.00%{opacity:1} 52.00%{opacity:0} 100.00%{opacity:0}}.a2{animation:a2 10s linear infinite}@keyframes a3{0.00%{opacity:0} 50.00%{opacity:0} 53.00%{opacity:1} 74.00%{opacity:1} 77.00%{opacity:0} 100.00%{opacity:0}}.a3{animation:a3 10s linear infinite}@keyframes a4{0.00%{opacity:0} 75.00%{opacity:0} 78.00%{opacity:1} 99.00%{opacity:1} 100.00%{opacity:0} 100.00%{opacity:0}}.a4{animation:a4 10s linear infinite}*{transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important}}</style><rect width="960" height="250" rx="18" fill="#FBF8FF" stroke="#E3E1EC"/><rect x="24" y="24" width="210" height="196" rx="16" fill="#FFFFFF" stroke="#E3E1EC" stroke-width="1.5"/><rect class="a1" x="24" y="24" width="210" height="196" rx="16" fill="#EEF0FF" stroke="#4355B9" stroke-width="2.5"/><circle cx="54" cy="54" r="15" fill="#4355B9"/><text x="54" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="111" y="78" width="36" height="24" rx="7" fill="none" stroke="#4355B9" stroke-width="2.5"/><path d="M121 102 l-4 8 l10 -8" fill="#4355B9"/><circle cx="121" cy="90" r="2.2" fill="#4355B9"/><circle cx="129" cy="90" r="2.2" fill="#4355B9"/><circle cx="137" cy="90" r="2.2" fill="#4355B9"/><text x="129" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1B1B21" font-weight="700" text-anchor="middle">You ask</text><text x="129" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">write to the agent</text><text x="129" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">from your phone</text><path d="M238 122 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#4355B9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="258" y="24" width="210" height="196" rx="16" fill="#FFFFFF" stroke="#E3E1EC" stroke-width="1.5"/><rect class="a2" x="258" y="24" width="210" height="196" rx="16" fill="#EEF0FF" stroke="#4355B9" stroke-width="2.5"/><circle cx="288" cy="54" r="15" fill="#4355B9"/><text x="288" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M355 81 l-11 11 l11 11 M371 81 l11 11 l-11 11 M367 78 l-8 28" fill="none" stroke="#4355B9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="363" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1B1B21" font-weight="700" text-anchor="middle">AI agent codes</text><text x="363" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">changes the project,</text><text x="363" y="194" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">rt sg --build</text><path d="M472 122 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#4355B9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="24" width="210" height="196" rx="16" fill="#FFFFFF" stroke="#E3E1EC" stroke-width="1.5"/><rect class="a3" x="492" y="24" width="210" height="196" rx="16" fill="#EEF0FF" stroke="#4355B9" stroke-width="2.5"/><circle cx="522" cy="54" r="15" fill="#4355B9"/><text x="522" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">3</text><path d="M597 75 l16 8 v18 l-16 8 l-16 -8 v-18 z M581 83 l16 8 l16 -8 M597 91 v18" fill="none" stroke="#4355B9" stroke-width="2.4" stroke-linejoin="round"/><text x="597" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1B1B21" font-weight="700" text-anchor="middle">RemoteAppTester builds</text><text x="597" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">with the commands</text><text x="597" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">you approved</text><path d="M706 122 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#4355B9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="726" y="24" width="210" height="196" rx="16" fill="#FFFFFF" stroke="#E3E1EC" stroke-width="1.5"/><rect class="a4" x="726" y="24" width="210" height="196" rx="16" fill="#EEF0FF" stroke="#4355B9" stroke-width="2.5"/><circle cx="756" cy="54" r="15" fill="#4355B9"/><text x="756" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="820" y="73" width="22" height="38" rx="5" fill="none" stroke="#4355B9" stroke-width="2.5"/><path d="M826 92 l4 4 l7 -8" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="831" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1B1B21" font-weight="700" text-anchor="middle">Phone installs</text><text x="831" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">over Tailscale,</text><text x="831" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5D5E72" font-weight="400" text-anchor="middle">and you test it</text><text x="480" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5D5E72" font-weight="500" text-anchor="middle">…then you write the next request, and the loop repeats.</text></svg>
